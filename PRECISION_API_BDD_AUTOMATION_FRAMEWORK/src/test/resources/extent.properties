# Reporter type ? spark is the modern HTML reporter
extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent-reports/ExtentReport.html

# Report look
extent.reporter.spark.theme=dark
extent.reporter.spark.documentTitle=Petstore API Automation
extent.reporter.spark.reportName=BDD Test Execution
extent.reporter.spark.offlineMode=false

# System info shown in report
extent.reporter.spark.viewOrder=dashboard,test,author,device,tag,exception,log